interface:
  display_name: "超云PPT设计"
  short_description: "把文章转换成信息完整、风格统一的整页文生图PPT"
  default_prompt: "风格可由客户自选或助手推荐：自选时发送 https://xcn5phmhnu1z.feishu.cn/share/base/view/shrcnveXqYYHOnI8tcUJqkOckxc 并请客户回复编号，按序号采用对应模板；委托推荐时再检索全库。商业发布用途先确认整套发布文案，再生成付费样张；样张与文案均确认后按授权范围批量制作。使用 $chaoyun-ppt-design 以飞书多维表格中的模板信息为准，优先匹配内容结构、页面组织方式、素材承载方式并核对判断依据，结合主要场景、具体场景、标签和正文容量检索全库，再把这篇文章制作成信息完整、风格统一的整页文生图PPT。"
